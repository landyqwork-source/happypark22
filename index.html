<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Название сайта -->
    <title>Название вашей компании | Строительство домов</title>
    
    <!-- Описание сайта (для поисковиков) -->
    <meta name="description" content="Краткое описание вашей компании и услуг. Например: Строительство современных загородных домов под ключ." />
    
    <!-- Ключевые слова (опционально) -->
    <meta name="keywords" content="строительство домов, загородные дома, проекты домов, под ключ" />
    
    <!-- Favicon (иконка во вкладке браузера). Замените href на путь к вашей иконке -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Альтернативные форматы иконки (раскомментируйте при необходимости) -->
    <!-- <link rel="icon" type="image/png" href="/favicon.png" /> -->
    <!-- <link rel="apple-touch-icon" href="/apple-touch-icon.png" /> -->
    
    <!-- Open Graph (для красивых превью в соцсетях и мессенджерах) -->
    <meta property="og:title" content="Название вашей компании | Строительство домов" />
    <meta property="og:description" content="Краткое описание вашей компании и услуг." />
    <meta property="og:image" content="/og-image.jpg" /> <!-- Замените на путь к вашей картинке-превью -->
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
